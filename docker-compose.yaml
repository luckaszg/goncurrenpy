services:
  server:
    build:
      context: .
      target: server
    ports:
      - "8000:8000"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./src/py-pr/server/src
          target: ./app/src
          initial_sync: true
  
  goserver:
    build:
      context: .
      target: goserver
    ports:
      - "8085:8085"
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./src/go-pr/

  client:
    build:
      context: .
      target: client
    ports:
      - "9000:9000"
    depends_on:
      - server
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./client
          target: ./app
          initial_sync: true
          ignore:
            - node_modules/
        
        - action: rebuild
          path: package.json
