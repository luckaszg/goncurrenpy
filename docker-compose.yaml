services:
  server:
    build:
      context: .
      target: server
    ports:
      - "8000:8000"
    restart: unless-stopped
  
  goserver:
    build:
      context: .
      target: goserver
    ports:
      - "8085:8085"
    restart: unless-stopped

  client:
    build:
      context: .
      target: client
    ports:
      - "9000:9000"
    depends_on:
      - server
    restart: unless-stopped
